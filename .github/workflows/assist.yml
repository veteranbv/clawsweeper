name: ClawSweeper live label-sync proof

run-name: Live label-sync proof (${{ inputs.question }})

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Synthetic fixture repository"
        required: true
        default: veteranbv/clawsweeper
        type: string
      item_number:
        description: "Synthetic draft PR number"
        required: true
        default: "1"
        type: string
      question:
        description: "Proof phase: preseed, postreview, posthuman, apply-before, apply-after, apply-blocked, or snapshot"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proof harness
        uses: actions/checkout@v7
        with:
          ref: proof/live-label-sync-executor
          path: harness
          persist-credentials: false

      - name: Check out exact PR patch
        if: ${{ startsWith(inputs.question, 'apply-') }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.question == 'apply-before' && '846b73c666c01b1c29d8a65a93549fca5742b404' || '12228184bbf34aab227c3e1f087eec9c4a8ed0fb' }}
          path: sut
          persist-credentials: false

      - name: Build exact PR patch
        if: ${{ startsWith(inputs.question, 'apply-') }}
        uses: ./harness/.github/actions/setup-pnpm
        with:
          working-directory: sut
          build-script: build

      - name: Exercise live GitHub activity and label synchronization
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_MODE: ${{ inputs.question }}
          PROOF_REPO: ${{ inputs.target_repo }}
          PROOF_PR: ${{ inputs.item_number }}
          PROOF_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAWSWEEPER_COMMENT_AUTHOR_LOGIN: github-actions[bot]
        run: bash harness/proof/live-label-sync-executor.sh

      - name: Upload machine-readable proof
        uses: actions/upload-artifact@v4
        with:
          name: live-label-sync-${{ inputs.question }}
          path: proof-output/
          if-no-files-found: error
          retention-days: 30
